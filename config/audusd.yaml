# AUDUSD Configuration Profile
# Optimized based on Phase 2 backtest results
# BEST RESULT: Sweep filter highly effective on this pair (+0.12R!)

symbol: capital.com:AUDUSD
description: "Australian Dollar vs US Dollar - Sweep + H4 Counter optimized"

# Strategy Configuration
strategy:
  atr_threshold: 0.25
  atr_period: 14
  lookback: 8
  h4_ema_period: 20
  daily_lookback: 20

# Filter Configuration
filters:
  use_sweep_filter: true         # HIGHLY EFFECTIVE on AUDUSD (+0.12R!)
  use_bos_filter: false          # Disabled - filters 100%
  use_h4_filter: true            # H4 Counter: reliable baseline
  h4_filter_mode: counter        # Trade reversals against H4 bias
  use_daily_filter: false        # Optional, not needed for this pair

# Expected Performance (from Phase 2 backtest)
expectations:
  expectancy: -0.07R             # Closest to break-even! With Sweep + H4
  trades: 81                      # Over 2-year period
  win_rate: 30.9%                # Highest win rate, approaching +EV threshold
  comment: "AUDUSD shows strongest results with sweep filter enabled"
  target_breakeven: "Need +0.07R improvement or +2.4% win rate gain (to 33.3%)"
